# Configuración de Despliegue en Netlify - Radar Táctico MTB PWA
[build]
  publish = "."

# Soporte de enrutamiento SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados para PWA móvil, Service Worker y caché
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
