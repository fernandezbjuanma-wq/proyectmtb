name: Compilar APK Android - Radar MTB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataformas y herramientas de Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Sincronizar archivos web a assets Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp Vuelta_ciclística_por_la_mañana.gpx android/app/src/main/assets/ || true

      - name: Compilar APK Debug
        run: |
          gradle -p android :app:assembleDebug --no-daemon

      - name: Preparar archivo APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk radar-mtb.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Radar-MTB-APK
          path: radar-mtb.apk
          if-no-files-found: error
