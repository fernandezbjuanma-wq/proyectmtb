name: Android GPS - compilar APK
on:
  push:
    branches: [ "feat/gps-android-grabacion-nativa-final-20261028" ]
    paths:
      - "android/**"
      - ".github/workflows/android-gps.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-gps.yml"
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar APK debug
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: radar-mtb-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
